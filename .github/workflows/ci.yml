name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chronicle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run Chronicle verification suite
        run: make test-chronicle
