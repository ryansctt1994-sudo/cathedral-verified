name: verify

on:
  push:
  pull_request:

jobs:
  chronicle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Chronicle verification suite
        run: cd chronicle && python3 test_chronicle.py
      - name: Chronicle hardening negative controls
        run: cd chronicle && python3 -m unittest -v test_chronicle_hardening
