name: verify

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Layer 0 source-policy checks
        run: PYTHONPATH=src:. python3 -m unittest tests.test_bootstrap -v
      - name: Run Weaver Recognition Kernel checks
        run: PYTHONPATH=src:. python3 -m unittest tests.test_recognition_kernel -v
      - name: Run classifier assurance checks
        run: PYTHONPATH=src:. python3 -m unittest tests.test_classifier_assurance -v
      - name: Run Chronicle verification suite
        run: cd chronicle && python3 test_chronicle.py
      - name: Run Cathedral Forge P0 regression suite
        run: PYTHONPATH=src:. python3 -m unittest discover -s tests -p 'test_p0_regressions.py' -v

  rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run Lucifer Latch RTL simulation
        run: make test-hw
